<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Websocket</title>
</head>
<body>
    <h1>Websocket Demo</h1>

    <input id="messageInput" type="text" placeholder="Type a message...">
    <button onclick="sendMessage()">Kirim</button>

    <br><br>

    <div>
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Arah</th>
                    <th>Pengirim</th>
                    <th>Penerima</th>
                    <th>Pesan</th>
                </tr>
            </thead>
            <tbody id="messages"></tbody>
        </table>
    </div>
</body>

 <script>
    const socket = new WebSocket("ws://localhost:3000");

    socket.onopen = () => {
        console.log("Koneksi terhubung");
    };

    socket.onmessage = (event) => {
        console.log("Pesan diterima:", event.data);
        addMessage("Diterima", "Server", "Client", event.data);
    };

    socket.onclose = () => {
        console.log("Koneksi ditutup");
    };

    socket.onerror = (error) => {
        console.error("Terjadi kesalahan:", error);
    };

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const message = input.value.trim();
        if (message && socket.readyState === WebSocket.OPEN) {
            socket.send(message);
            addMessage("Dikirim", "Client", "Server", message);
            input.value = "";
        }
    };

    function addMessage(direction, sender, receiver, message) {
        const tr = document.createElement("tr");

        const timeTd = document.createElement("td");
        timeTd.textContent = new Date().toLocaleTimeString();

        const directionTd = document.createElement("td");
        directionTd.textContent = direction;

        const senderTd = document.createElement("td");
        senderTd.textContent = sender;

        const receiverTd = document.createElement("td");
        receiverTd.textContent = receiver;

        const messageTd = document.createElement("td");
        messageTd.textContent = message;

        tr.appendChild(timeTd);
        tr.appendChild(directionTd);
        tr.appendChild(senderTd);
        tr.appendChild(receiverTd);
        tr.appendChild(messageTd);

        document.getElementById("messages").appendChild(tr);
    };
</script>
</html>
